{q:"Eddy current inspection is based on which physical phenomenon?",o:["The reflection of high-frequency sound waves","The interaction between an induced electromagnetic field and circulatory currents (eddy currents) generated in the metal","Measuring surface temperature","The reflection of visible light"],a:1,e:"Eddy current inspection is based on the interaction between the electromagnetic field applied via a coil and the eddy currents induced in the conductive material under test."},
{q:"Magnetic particle inspection is applicable to which types of material?",o:["Only non-metallic materials such as plastic","Only ferromagnetic materials such as iron and steel","All materials without exception","Only carbon fiber composite materials"],a:1,e:"Magnetic particle inspection detects invisible cracks and defects in ferromagnetic materials (iron, steel); it is not applicable to non-magnetic materials such as aluminum."},
{q:"In the ultrasonic \"pulse echo\" method, how are defects detected?",o:["By measuring the amplitude of reflected signals and the time it takes them to travel between surfaces and the discontinuity","By only measuring the temperature of the part","By observing the material's color under UV light","By weighing the component before and after inspection"],a:0,e:"In the pulse echo method, defects are detected by measuring the amplitude of reflected signals and the time required for them to travel between specific surfaces and the discontinuity (defect)."},
{q:"In ultrasonic inspection, what is the \"couplant\" used for?",o:["To electrically amplify the signal","To couple the transducer to the part being tested, since ultrasonic energy does not travel through air","To clean the surface after inspection","To temporarily magnetize the part"],a:1,e:"The couplant (water, glycerin, oils, grease) is needed to acoustically couple the transducer to the part, since ultrasonic energy does not travel effectively through air."},
{q:"Why is radiographic (X-ray) inspection considered advantageous compared to other NDI methods?",o:["It always requires complete disassembly of the component","It allows internal defects to be located with little or no disassembly of the structure","It's the only method applicable to composite materials","It poses no risk at all to the operator"],a:1,e:"Radiographic inspection allows defects to be located in structures and engines with little or no disassembly, unlike many other NDI methods that require removal and stripping of the suspect part; however, it does involve radiation risks that must be carefully managed."},
{q:"Under 14 CFR Part 91, how frequently must a complete annual inspection of an aircraft take place (with some exceptions)?",o:["Every 6 months","Annually","Every 2 years","Only upon the owner's request"],a:1,e:"With some exceptions, all aircraft must have a complete inspection annually, as required by 14 CFR part 91."},
{q:"What is the main purpose of a progressive inspection program?",o:["To increase the aircraft's downtime","To break the scope of the annual inspection into multiple stages to minimize downtime","To completely replace the mandatory annual inspection","To eliminate the need for inspections on commercial aircraft"],a:1,e:"A progressive inspection program breaks the scope and detail of the annual inspection into successive stages, allowing the aircraft's downtime to be minimized."},
{q:"How often, in calendar months, must the altimeter and static system be tested per 14 CFR Part 43 Appendix E, for aircraft operated under IFR in controlled airspace?",o:["12 months","24 months","36 months","Never required if the aircraft only flies VFR"],a:1,e:"Aircraft operated under IFR rules in controlled airspace must have the altimeter and static system tested within the preceding 24 calendar months, per 14 CFR part 43, Appendix E."},
{q:"Continuous inspection programs typically apply to which types of aircraft?",o:["Only ultralights","Large or turbine-powered aircraft, due to their greater complexity","Only experimental aircraft","Only single-engine light helicopters"],a:1,e:"Continuous inspection programs are similar to progressive ones but apply to large or turbine-powered aircraft, being more complex and requiring FAA approval."},
],
ch11: [
{q:"What is a torque wrench mainly used for?",o:["Measuring the length of a bolt","Measuring and applying a precise turning force (torque) when tightening nuts and bolts","Measuring the component's temperature","Cutting bolts that are too long"],a:1,e:"A torque wrench is a precision tool that measures the amount of turning force (torque) applied during tightening, ensuring the specified value is met."},
{q:"What is a \"flare nut\" wrench, and what is it used for?",o:["A standard socket wrench with no opening","A wrench similar to a box-end wrench but cut open on one side, used on the B-nuts of fuel/hydraulic/oxygen lines","A wrench used only on electrical components","A digital torque wrench"],a:1,e:"The flare nut wrench looks like a box-end wrench that's been cut open on one side, allowing it to be slipped onto a tube line to work on the B-nut without having to remove it from the end."},
{q:"A twist drill is characterized by:",o:["A cylindrical hardened steel body with spiral flutes and a conical point with cutting edges","A completely flat shape with no flutes","A body made exclusively of reinforced plastic","The complete absence of cutting edges"],a:0,e:"A twist drill is a cylindrical hardened steel tool with spiral flutes running along the body and a conical point whose cutting edges are formed by the ends of the flutes."},
{q:"When reading a micrometer, the lines on the barrel numbered 1, 2, 3, 4 typically indicate measurements of:",o:["Whole millimeters","Tenths of an inch (0.100\", 0.200\", 0.300\"...)","Hundredths of a millimeter","Angular degrees"],a:1,e:"On a standard micrometer barrel, the lines numbered 1, 2, 3, 4 indicate increments of one tenth of an inch: 0.100\", 0.200\", 0.300\", and so on."},
{q:"What does a vernier scale on a micrometer allow you to do?",o:["Directly measure the part's temperature","Directly read fractions even smaller than a division already shown on the thimble scale","Automatically convert inches to millimeters","Lock the micrometer in place"],a:1,e:"A vernier scale allows you to directly read fractions even finer than a division of the thimble scale, increasing the reading precision of the micrometer."},
{q:"Double-cut files are used mainly for:",o:["Only for sharpening saws","Finishing flat surfaces and similar work","Only for machining plastic materials","Only for electrical components"],a:1,e:"Hand files, double cut, with one smooth safe edge, are used mainly for finishing flat surfaces and similar work."},
{q:"During lathe filing, how should the file be held relative to the rotating workpiece?",o:["Rigid and motionless against the workpiece","In constant motion with a slight lateral sliding motion, not held rigidly","Always perpendicular to the lathe axis with no movement","A file is never used on a lathe"],a:1,e:"In lathe filing, the file should be kept in constant motion with a slight lateral gliding motion along the workpiece, not held rigid and stationary, to ensure a uniform finish."},
{q:"Why is one edge of a hand file left smooth (safe edge)?",o:["Purely for aesthetic reasons","To allow filing into corners without cutting into the adjacent surface","To increase the file's weight","It serves no practical function"],a:1,e:"The safe edge allows you to work near corners or adjacent surfaces without risk of accidentally cutting into them with the file's teeth."},
],
ch12: [
{q:"What is the formula for Ohm's Law relating voltage (V), current (I), and resistance (R)?",o:["V = I / R","V = I × R","V = I + R","V = I - R"],a:1,e:"Ohm's Law states that voltage (V) equals current (I) multiplied by resistance (R): V = I × R."},
{q:"In a purely SERIES circuit, how does the current behave at every point in the circuit?",o:["It's always different at each component","It's the same at every point in the circuit","It goes to zero across each resistor","It only depends on the applied voltage, not on the circuit"],a:1,e:"In a series circuit, since there is only one path for the current, it has the same value at every point in the circuit."},
{q:"In a purely PARALLEL circuit, what stays constant across each branch?",o:["The current","The voltage","The total resistance","The power dissipated"],a:1,e:"In a parallel circuit, the voltage is the same across each branch, while the current divides among the various branches according to their resistance."},
{q:"Kirchhoff's Voltage Law states that, in a closed circuit:",o:["The algebraic sum of all voltages is always zero","The total current is always zero","The total resistance is always zero","The total power is always infinite"],a:0,e:"Kirchhoff's Voltage Law states that, going around a closed loop, the algebraic sum of all voltage drops and electromotive forces is always zero."},
{q:"A lead-acid battery is an example of a:",o:["Primary cell, not rechargeable","Secondary cell, rechargeable (the chemical reaction is reversible)","Non-electrochemical cell","Cell usable only for very low-voltage applications"],a:1,e:"The lead-acid battery is a secondary cell: the electrochemical reaction that releases energy is reversible, allowing it to be recharged."},
{q:"How is the state of charge of a lead-acid battery measured?",o:["By measuring the battery's external temperature","By measuring the electrolyte's density with a hydrometer","By weighing the entire battery","By measuring only the electrolyte's color"],a:1,e:"The state of charge of a lead-acid battery is checked by measuring the density (specific gravity) of the electrolyte using a hydrometer."},
{q:"In nickel-cadmium (Ni-Cad) batteries, what substance makes up the electrolyte?",o:["Diluted sulfuric acid","A solution of potassium hydroxide (KOH)","Pure distilled water","Sodium chloride"],a:1,e:"The electrolyte of Ni-Cad batteries is a solution of potassium hydroxide (KOH) at a concentration of 20 to 34 percent by weight, dissolved in distilled water."},
{q:"What happens under overcharging conditions in a Ni-Cad battery?",o:["No particular risk occurs","Explosive mixtures of hydrogen and oxygen can develop","The battery spontaneously cools down","The electrolyte automatically becomes inert"],a:1,e:"During overcharging of Ni-Cad cells, potentially explosive mixtures of hydrogen and oxygen can develop, which is why charge control is critical."},
{q:"A capacitor in a direct current (DC) circuit, once fully charged, does what to the current?",o:["Allows continuous current flow","Blocks the flow of direct current (acts like an open circuit)","Amplifies the current exponentially","Converts direct current into alternating current"],a:1,e:"Once fully charged, a capacitor in DC blocks current flow, behaving like an open circuit; it does, however, allow alternating current (AC) to pass, with an opposition called capacitive reactance."},
{q:"What does inductive reactance represent in an AC circuit?",o:["The opposition to alternating current flow offered by an inductor, which increases with frequency","The pure resistance of a conductor","The opposition offered only by capacitors","A quantity independent of frequency"],a:0,e:"Inductive reactance is the opposition to alternating current flow offered by an inductor, and is directly proportional to the signal's frequency and to the inductance."},
{q:"A forward biased semiconductor diode allows current to flow. What happens if it is reverse biased?",o:["It allows current to flow in the same way","It (ideally) blocks current flow","It increases the output voltage","It behaves like an ideal capacitor"],a:1,e:"A reverse biased diode (ideally) blocks the flow of current, allowing current to flow in only one direction when forward biased."},
{q:"A Zener diode is typically used in a circuit to:",o:["Amplify an audio signal","Provide a stable reference voltage or regulate/limit voltage","Convert light into electricity","Store energy like a capacitor"],a:1,e:"A Zener diode, when reverse biased beyond its breakdown (Zener) voltage, maintains a constant voltage across it, which is why it's used as a voltage regulator/reference."},
{q:"In a bipolar junction transistor (BJT), what are the three main terminals?",o:["Anode, Cathode, Gate","Emitter, Base, Collector","Source, Drain, Gate","Positive, Negative, Neutral"],a:1,e:"A bipolar junction transistor has three terminals: Emitter, Base, and Collector."},
{q:"What is a transformer used for in an alternating current circuit?",o:["Converting DC to AC","Stepping voltage/current up or down through magnetic coupling between windings","Permanently storing electrical energy","Rectifying alternating current"],a:1,e:"A transformer uses magnetic coupling between the primary and secondary windings to step up or down the voltage level (and consequently the current) of an AC signal, with no direct electrical contact."},
{q:"What does a full-wave rectifier do?",o:["Converts direct current into alternating current","Converts both halves of the AC waveform into unidirectional pulsating current (pulsating DC)","Amplifies only the negative half-cycle","Completely blocks all current"],a:1,e:"A full-wave rectifier converts both halves (positive and negative) of the AC waveform into a single direction, producing pulsating direct current more efficiently than a half-wave rectifier."},
{q:"What does an ohmmeter measure?",o:["The voltage between two points in a circuit","The electrical resistance of a component or circuit","The frequency of an AC signal","The power dissipated in a resistor"],a:1,e:"An ohmmeter measures the electrical resistance of a component or circuit; the item being measured must not be energized during the measurement."},
{q:"In a DC generator, what is the function of the commutator?",o:["Increasing the generated voltage","Converting the internally generated alternating current into direct current output","Reducing mechanical friction","Electrically insulating the armature from the frame"],a:1,e:"The commutator is a segmented mechanical device that reverses the connections of the rotating armature, converting the internally generated alternating current into pulsating direct current output."},
{q:"What type of current does an alternator natively produce, before any rectification?",o:["Pure direct current","Alternating current (AC)","Static electricity","No current, only voltage"],a:1,e:"An alternator natively generates alternating current (AC); in aircraft electrical systems it is then rectified (via diodes) to supply direct current to the electrical system."},
{q:"What happens to total resistance when more resistors are added in parallel to a circuit?",o:["Total resistance always increases","Total resistance always decreases below the value of the smallest single branch","Total resistance always stays the same","It cannot be calculated mathematically"],a:1,e:"Adding resistors in parallel always decreases the circuit's total resistance, resulting in a value lower than the smallest individual resistor in the group."},
{q:"What is meant by \"true power\" in an AC circuit, measured in Watts?",o:["The total apparent power, without considering phase shift","The power actually dissipated as useful work (heat), accounting for the phase shift between voltage and current","Purely reactive power, measured in VAR","Power measured only in DC circuits"],a:1,e:"True power, measured in Watts, represents the power actually dissipated as useful work in an AC circuit, accounting for the phase shift between voltage and current (unlike apparent power)."},
{q:"Compared to a ceramic capacitor, an electrolytic capacitor is generally characterized by:",o:["Much lower capacitance but polarity doesn't matter","Much higher capacitance, but with polarity that must be respected during installation","No polarity at all and very low capacitance","It cannot be used in DC circuits"],a:1,e:"Electrolytic capacitors generally offer much higher capacitance than ceramic ones, but they are polarized: installation polarity must be respected, or the component can be damaged."},
{q:"A MOSFET field-effect transistor differs from a BJT mainly because it:",o:["Is controlled by current rather than voltage","Is controlled mainly by the voltage applied to the gate, with negligible control current","Can never be used as an electronic switch","Only works with pure direct current"],a:1,e:"Unlike the BJT (controlled by base current), the MOSFET is controlled primarily by the voltage applied to the gate terminal, with negligible gate control current."},
{q:"What does the term \"free electrons\" mean in a good electrical conductor?",o:["Electrons strongly bound to the nucleus, unable to move","Weakly bound outer-shell (valence) electrons, able to move easily between atoms","Only electrons found in insulating materials","A concept not applicable to conductor physics"],a:1,e:"Conductive materials have valence electrons weakly bound to the nucleus (free electrons), which can move easily between atoms under the influence of an electric field, allowing current to flow."},
{q:"In a series-parallel circuit, how is total resistance generally calculated?",o:["By simply adding all resistances as in a purely series circuit","By progressively reducing the parallel sections to equivalent resistances, then adding them in series with the rest","It can never be calculated in mixed circuits","By dividing the number of resistors by the applied voltage"],a:1,e:"In a series-parallel circuit, the parallel sections are first reduced to a single equivalent resistance, then these equivalent resistances are added together with the series resistances to obtain the total resistance."},
{q:"What does the term \"static electricity\" indicate compared to ordinary electric current?",o:["An accumulated, generally stationary electric charge, not a continuous flow of electrons like current","It is always identical to alternating current","It only concerns metallic materials","There is no distinction between the two concepts"],a:0,e:"Static electricity is an accumulated electric charge on a surface, generally stationary, distinct from the continuous flow of electrons that characterizes ordinary electric current."},

const chapterMeta = [
  {id:'ch1', num:1, title:'Sicurezza, Operazioni a Terra e Rifornimento'},
  {id:'ch2', num:2, title:'Normative, Moduli, Registri e Pubblicazioni'},
  {id:'ch3', num:3, title:'Matematica per la Manutenzione'},
  {id:'ch4', num:4, title:'Disegni Tecnici Aeronautici'},
  {id:'ch5', num:5, title:'Fisica per l\'Aviazione'},
  {id:'ch6', num:6, title:'Peso e Bilanciamento'},
  {id:'ch7', num:7, title:'Materiali, Hardware e Processi'},
  {id:'ch8', num:8, title:'Pulizia e Controllo Corrosione'},
  {id:'ch9', num:9, title:'Linee e Raccordi Fluidi'},
  {id:'ch10', num:10, title:'Concetti e Tecniche di Ispezione'},
  {id:'ch11', num:11, title:'Utensili Manuali e di Misura'},
  {id:'ch12', num:12, title:'Elettricità ed Elettronica'},
  {id:'ch13', num:13, title:'Privilegi e Limitazioni del Meccanico'},
  {id:'ch14', num:14, title:'Fattori Umani'}
];

/* ====================== STATO APP ====================== */
let currentChapter = null;
let currentQuestions = [];
let currentIndex = 0;
let selectedOption = null;
let answered = false;
let userAnswers = []; // {qIndex, chosen, correct}

const PASS_MARGIN = 0.90;
const STORAGE_KEY = 'amtg_quiz_scores';

function loadScores(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function saveScore(chapterId, pct){
  const scores = loadScores();
  if(!scores[chapterId] || pct > scores[chapterId]){
    scores[chapterId] = pct;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ====================== SCHERMATA HOME ====================== */
function renderHome(){
  const scores = loadScores();
  const listEl = document.getElementById('chapterList');
  listEl.innerHTML = '';
  let total = 0;
  chapterMeta.forEach(ch=>{
    const qs = quizData[ch.id] || [];
    total += qs.length;
    const best = scores[ch.id];
    let scoreHtml = '<span class="score-none">Non ancora fatto</span>';
    if(best !== undefined){
      const cls = best >= PASS_MARGIN*100 ? 'score-pass' : 'score-fail';
      scoreHtml = `<span class="${cls}">${best}%</span>`;
    }
    const div = document.createElement('div');
    div.className = 'card chapter-card';
    div.onclick = ()=>startQuiz(ch.id);
    div.innerHTML = `
      <div class="chapter-info">
        <div class="chapter-title">Cap. ${ch.num} — ${ch.title}</div>
        <div class="chapter-meta">${qs.length} domande</div>
      </div>
      <div class="chapter-score">${scoreHtml}</div>
    `;
    listEl.appendChild(div);
  });
  document.getElementById('totalQCount').textContent = total + ' domande totali';
}

function goHome(){
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-home').classList.remove('hidden');
  renderHome();
}

function confirmExit(){
  if(confirm('Uscire dal quiz? I progressi di questo tentativo andranno persi.')){
    goHome();
  }
}

/* ====================== QUIZ ====================== */
function startQuiz(chapterId){
  currentChapter = chapterId;
  const raw = quizData[chapterId] || [];
  currentQuestions = shuffle(raw);
  currentIndex = 0;
  userAnswers = [];
  document.getElementById('screen-home').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  renderQuestion();
}

function retryQuiz(){
  startQuiz(currentChapter);
}

function renderQuestion(){
  answered = false;
  selectedOption = null;
  const q = currentQuestions[currentIndex];
  document.getElementById('quizProgressText').textContent =
    `Domanda ${currentIndex+1} di ${currentQuestions.length}`;
  document.getElementById('progressFill').style.width =
    ((currentIndex)/currentQuestions.length*100) + '%';
  document.getElementById('qText').textContent = q.q;
  const optsWrap = document.getElementById('optionsList');
  optsWrap.innerHTML = '';
  const order = shuffle(q.o.map((text,i)=>({text,i})));
  order.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.text;
    btn.onclick = ()=>selectOption(btn, opt.i);
    optsWrap.appendChild(btn);
  });
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = 'Conferma risposta';
}

function selectOption(btn, originalIndex){
  if(answered) return;
  document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedOption = originalIndex;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  if(!answered){
    // conferma risposta -> mostra correzione
    answered = true;
    const q = currentQuestions[currentIndex];
    const isCorrect = selectedOption === q.a;
    document.querySelectorAll('.option').forEach(b=>{
      const btnIndex = q.o.indexOf(b.textContent);
    });
    // Ricostruiamo il mapping cliccando sugli elementi già in DOM
    const opts = document.querySelectorAll('.option');
    opts.forEach(b=>{
      const text = b.textContent;
      const idx = q.o.indexOf(text);
      if(idx === q.a) b.classList.add('correct');
      else if(b.classList.contains('selected') && idx !== q.a) b.classList.add('wrong');
      b.onclick = null;
    });
    userAnswers.push({q: q, chosen: selectedOption, correct: q.a, isCorrect});
    document.getElementById('nextBtn').textContent =
      currentIndex < currentQuestions.length-1 ? 'Prossima domanda →' : 'Vedi risultato';
    return;
  }
  // passa alla prossima
  currentIndex++;
  if(currentIndex >= currentQuestions.length){
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult(){
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  const correctCount = userAnswers.filter(a=>a.isCorrect).length;
  const total = userAnswers.length;
  const pct = Math.round((correctCount/total)*100);
  const passed = pct >= PASS_MARGIN*100;
  saveScore(currentChapter, pct);

  const chMeta = chapterMeta.find(c=>c.id===currentChapter);
  document.getElementById('resultChapterName').textContent = `Cap. ${chMeta.num} — ${chMeta.title}`;
  document.getElementById('resultPct').textContent = pct + '%';
  document.getElementById('resultLabel').textContent = passed ? 'SUPERATO ✓' : 'NON SUPERATO';
  document.getElementById('resultDetail').textContent = `${correctCount} risposte corrette su ${total} (soglia: 90%)`;
  document.getElementById('resultBox').className = 'card resultbig ' + (passed ? 'pass' : 'fail');

  const reviewWrap = document.getElementById('reviewSection');
  const wrongAnswers = userAnswers.filter(a=>!a.isCorrect);
  if(wrongAnswers.length === 0){
    reviewWrap.innerHTML = '<div class="card" style="text-align:center;color:var(--good);">🎉 Tutte le risposte corrette! Nessun errore da rivedere.</div>';
  } else {
    let html = `<h2 style="margin-top:20px;">Ripasso errori (${wrongAnswers.length})</h2>`;
    wrongAnswers.forEach(a=>{
      html += `
        <div class="card reviewq">
          <span class="tag no">Sbagliata</span>
          <div class="qtext" style="font-size:0.98rem;">${a.q.q}</div>
          <div class="chapter-meta">La tua risposta: <span style="color:var(--bad);">${a.q.o[a.chosen] !== undefined ? a.q.o[a.chosen] : '(nessuna)'}</span></div>
          <div class="chapter-meta">Risposta corretta: <span style="color:var(--good);">${a.q.o[a.correct]}</span></div>
          <div class="explbox">💡 ${a.q.e}</div>
        </div>
      `;
    });
    reviewWrap.innerHTML = html;
  }
}

/* ====================== INIT ====================== */
renderHome();
</script>
